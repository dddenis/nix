onboarding = false

[keys]
detach = "prefix+backspace"
last_pane = "prefix+`"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
prefix = "ctrl+a"

[[keys.command]]
key = "prefix+q"
type = "plugin_action"
command = "ddd.workspace-last-tab.toggle"
description = "toggle last tab in workspace"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "ddd.workspace-last-tab.toggle"
description = "toggle last tab in workspace"

[theme]
name = "gruvbox"

[theme.custom]
accent = "#89b482"
panel_bg = "#282828"
surface0 = "#32302f"
surface1 = "#45403d"
surface_dim = "#1b1b1b"
overlay0 = "#7c6f64"
overlay1 = "#928374"
text = "#d4be98"
subtext0 = "#a89984"
mauve = "#d3869b"
green = "#a9b665"
yellow = "#d8a657"
red = "#ea6962"
blue = "#7daea3"
teal = "#89b482"
peach = "#e78a4e"

[ui.sound]
enabled = true
path = "notification.mp3"
